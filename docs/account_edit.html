<!DOCTYPE html>
<html class="light">

<head>
    <title>Editar perfil | SleepCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <header>
        <div class="navigation-title">
            <a href="index.html"><span class="material-symbols-outlined">
                    close
                </span></a>
            <h3>Editar perfil</h3>
        </div>
        <div class="hidden">
            <img class="logo-container" alt="Logo de SleepCare" />
        </div>
        <div class="navigation-actions">
            <a class="action-text" href="account.html">Guardar</a>
        </div>
    </header>
    <div class="content">
        <div class="profile center">
            <img src="" alt="Foto de perfil" />
        </div>
        <form>
            <section>
                <label for="inp_name">Nombre</label>
                <input id="inp_name" type="text" name="name" value="Susana" />
            </section>
            <section>
                <label for="inp_surname">Apellidos</label>
                <input id="inp_surname" type="text" name="surname" value="García" />
            </section>
            <section>
                <label for="inp_email">Correo electrónico</label>
                <input id="inp_email" type="email" name="email" value="susana@example.org" />
            </section>
        </form>
    </div>
</body>

</html>
